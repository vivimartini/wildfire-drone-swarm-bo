name: tests

on:
  push:
  pull_request:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-repro.txt
      - run: python -m pip install -r requirements-repro.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: MPLBACKEND=Agg python -m fire_model.demo --quick --output-dir artifacts/reproduction
      - uses: actions/upload-artifact@v4
        with:
          name: reproduction-output
          path: artifacts/reproduction/
