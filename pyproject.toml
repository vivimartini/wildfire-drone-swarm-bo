[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-drone-swarm-bo"
version = "0.1.0"
description = "Optimising drone swarms to fight wildfires with Bayesian optimisation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
]

[project.optional-dependencies]
notebooks = [
    "pandas",
    "seaborn",
    "tqdm",
]
dev = ["pytest"]

[project.scripts]
wildfire-bo-demo = "fire_model.demo:main"

[tool.setuptools.packages.find]
include = ["fire_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
