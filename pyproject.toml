[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-drone-swarm-bo"
version = "0.1.0"
description = "Optimising drone swarms to fight wildfires with Bayesian optimisation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "GPy",
    "botorch",
    "torch",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["fire_model*"]
